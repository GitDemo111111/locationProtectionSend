# 工作流名称
# 原因：在GitHub Actions界面中显示的名称，便于识别
name: Selenium CI

# 触发条件
# 原因：定义何时启动此工作流
on:
  # 当代码推送到master分支时触发
  push:
    branches: [ master ]
  # 当有针对main分支的拉取请求时触发
  pull_request:
    branches: [ main ]

# 定义工作流中的任务
jobs:
  # 定义名为test的任务
  test:
    # 指定运行环境为最新版Ubuntu
    # 原因：GitHub Actions提供的虚拟环境，用于运行测试
    runs-on: ubuntu-latest

    # 策略配置
    # 原因：允许使用矩阵策略并行运行多个配置的测试
    strategy:
      # 定义矩阵变量
      matrix:
        # 指定要在多个浏览器中运行测试
        # 原因：确保应用在不同浏览器中都能正常工作
        browser: [Chrome]  # 并行执行多浏览器测试

    # 定义任务中的步骤
    steps:
      # 步骤1：检出代码
      # 原因：将仓库代码克隆到运行环境中
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Python环境
      # 原因：配置测试所需的Python版本
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # 指定Python版本为3.11
          python-version: '3.11'

      # 步骤3：安装依赖
      # 原因：安装测试所需的Python包
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-xdist pytest-html   # 👈 加在这里

      # 步骤4：设置Chrome浏览器
      # 原因：为Chrome浏览器测试做准备
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        # 仅当矩阵浏览器为chrome时执行此步骤
        if: matrix.browser == 'chrome'



      - name: Create reports directory
        run: mkdir -p reports

      # 步骤6：运行测试
      # 原因：执行测试脚本
      - name: Run tests
        run: |
          pytest tests/ -v --maxfail=5 --html=reports/report.html --self-contained-html
          echo "===== 检查报告文件是否生成 ====="
          ls -la reports/   # 这一行会在 CI 日志里列出 reports 文件夹下的所有文件
          echo "===== 检查结束 ====="

      - name: Upload test artifacts
        if: always()   # 无论测试成功或失败都上传
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          # 重点：用空格隔开多个路径，写成一行字符串
          path: |
            reports/
            screenshots/
            *.log
